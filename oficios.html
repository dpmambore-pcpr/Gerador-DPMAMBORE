<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central de Ofícios — PCPR</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f5f7fa;font-family:Segoe UI,Arial,sans-serif;color:#17202a}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dbe2ea;padding:10px 16px;display:flex;gap:8px;align-items:center;box-shadow:0 1px 4px rgba(15,23,42,.04)}
.brand{font-weight:800;color:#0b2a4a;margin-right:10px;white-space:nowrap}
.tab{border:1px solid #cbd5e1;background:#fff;color:#234;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:700;transition:.15s ease}
.tab:hover{background:#f2f6fa;border-color:#9fb0c1}
.tab.active{background:#0b2a4a;color:#fff;border-color:#0b2a4a}
.hint{margin-left:auto;font-size:12px;color:#64748b;text-align:right}
.frame{display:none;width:100%;border:0;min-height:calc(100vh - 55px);background:#fff}
.frame.active{display:block}
@media(max-width:900px){.top{flex-wrap:wrap}.hint{width:100%;margin-left:0;text-align:left}}
@media(max-width:560px){.brand{width:100%;margin-right:0}.tab{flex:1 1 calc(50% - 8px);padding:8px 9px}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">CENTRAL DE OFÍCIOS</div>
  <button class="tab active" type="button" data-target="fOficios">Ofícios</button>
  <button class="tab" type="button" data-target="fCoffee">Coffee Break</button>
  <button class="tab" type="button" data-target="fOitiva">Oitiva em Penitenciária</button>
  <button class="tab" type="button" data-target="fPericia">Perícia</button>
  <div class="hint">Ofícios · Coffee Break · Oitiva · Perícia · dados mantidos localmente no navegador</div>
</div>

<iframe id="fOficios" class="frame active" src="oficios-core.html" title="Ofícios"></iframe>
<iframe id="fCoffee" class="frame" src="oficio-coffee-break.html" title="Ofício — Solicitação de Coffee Break"></iframe>
<iframe id="fOitiva" class="frame" src="oitiva-penitenciaria.html" title="Oitiva em Penitenciária"></iframe>
<iframe id="fPericia" class="frame" src="pericia.html" title="Ofício à Perícia"></iframe>

<script>
'use strict';
const tabs=[...document.querySelectorAll('.tab')];
const frames=[...document.querySelectorAll('.frame')];

function fit(frame){
  try{
    const d=frame.contentDocument;
    const h=Math.max(d?.documentElement?.scrollHeight||0,d?.body?.scrollHeight||0,900);
    frame.style.height=(h+24)+'px';
  }catch(e){
    frame.style.height='calc(100vh - 55px)';
  }
}

function activate(targetId){
  tabs.forEach(btn=>btn.classList.toggle('active',btn.dataset.target===targetId));
  frames.forEach(frame=>frame.classList.toggle('active',frame.id===targetId));
  const frame=document.getElementById(targetId);
  if(frame){
    setTimeout(()=>fit(frame),80);
    setTimeout(()=>fit(frame),350);
  }
  window.scrollTo({top:0,behavior:'auto'});
}

tabs.forEach(btn=>btn.addEventListener('click',()=>activate(btn.dataset.target)));

frames.forEach(frame=>{
  frame.addEventListener('load',()=>{
    fit(frame);
    try{
      const root=frame.contentDocument.documentElement;
      new ResizeObserver(()=>fit(frame)).observe(root);
    }catch(e){}
  });
});
</script>
</body>
</html>
