<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofícios — Central PCPR</title>
<style>
:root{--bg:#0b0d0f;--panel:#12161a;--panel2:#171c21;--line:#2c333a;--gold:#c5a253;--text:#f3f0e8;--muted:#aeb5bc;--green:#7fb08b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:14px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#171b1f,#101316)}
.title h1{font-size:18px;margin:0 0 3px}.title p{font-size:11px;color:var(--muted);margin:0}
.badge{font-size:9px;font-weight:900;letter-spacing:.8px;color:#eadba9;border:1px solid #5a4b27;background:#211d12;padding:6px 9px;border-radius:999px}
.tools{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.tool{appearance:none;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);padding:11px 10px;text-align:left;cursor:pointer;transition:.15s}
.tool:hover{border-color:#6e5b31;transform:translateY(-1px);background:var(--panel2)}
.tool.active{border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(197,162,83,.25);background:#1b1912}
.tool b{display:block;font-size:11px;margin-bottom:3px}.tool span{display:block;font-size:9px;color:var(--muted);line-height:1.3}
.framebox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;min-height:780px}
iframe{display:block;width:100%;height:calc(100vh - 175px);min-height:780px;border:0;background:#fff}
@media(max-width:1050px){.tools{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.wrap{padding:8px}.head{align-items:flex-start;flex-direction:column}.tools{grid-template-columns:repeat(2,1fr)}iframe{height:calc(100vh - 245px)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="title">
      <h1>Central de Ofícios</h1>
      <p>Selecione o expediente. Todos os geradores continuam dentro da aba Ofícios.</p>
    </div>
    <span class="badge">MÓDULOS INTEGRADOS</span>
  </header>

  <nav class="tools" aria-label="Tipos de ofício">
    <button class="tool active" data-src="oficios-core.html"><b>📄 Ofícios</b><span>Requisições e expedientes gerais</span></button>
    <button class="tool" data-src="oficio-diaria.html"><b>🧳 Diárias</b><span>Solicitação e expediente de diária</span></button>
    <button class="tool" data-src="relatorio-viagem.html"><b>🚗 Relatório de Viagem</b><span>Relatório e prestação da viagem</span></button>
    <button class="tool" data-src="pericia.html"><b>🔬 Perícia</b><span>Expedientes e requisições periciais</span></button>
    <button class="tool" data-src="oitiva-penitenciaria.html"><b>🎥 Oitiva</b><span>Oitiva em unidade penal</span></button>
    <button class="tool" data-src="oficio-coffee-break.html"><b>☕ Coffee Break</b><span>Ofício específico de coffee break</span></button>
  </nav>

  <section class="framebox">
    <iframe id="officeFrame" src="oficios-core.html" title="Gerador selecionado"></iframe>
  </section>
</div>
<script>
(()=>{
 const frame=document.getElementById('officeFrame');
 document.querySelectorAll('.tool').forEach(btn=>{
   btn.addEventListener('click',()=>{
     document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));
     btn.classList.add('active');
     frame.src=btn.dataset.src;
     try{localStorage.setItem('pcpr.ultimoOficio',btn.dataset.src)}catch(e){}
     window.scrollTo({top:0,behavior:'smooth'});
   });
 });
 try{
   const last=localStorage.getItem('pcpr.ultimoOficio');
   const btn=[...document.querySelectorAll('.tool')].find(x=>x.dataset.src===last);
   if(btn)btn.click();
 }catch(e){}
})();
</script>
</body>
</html>
