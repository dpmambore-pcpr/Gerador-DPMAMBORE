<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Ofícios — PCPR</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f7fa;font-family:Segoe UI,Arial,sans-serif;color:#17202a}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #dbe2ea;padding:10px 16px;display:flex;gap:8px;align-items:center}.brand{font-weight:800;color:#0b2a4a;margin-right:10px}.tab{border:1px solid #cbd5e1;background:#fff;color:#234;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:700}.tab.active{background:#0b2a4a;color:#fff;border-color:#0b2a4a}.hint{margin-left:auto;font-size:12px;color:#64748b}.frame{display:none;width:100%;border:0;min-height:calc(100vh - 55px);background:#fff}.frame.active{display:block}@media(max-width:760px){.top{flex-wrap:wrap}.hint{width:100%;margin-left:0}}
</style></head><body><div class="top"><div class="brand">CENTRAL DE OFÍCIOS</div><button class="tab active" data-target="fOficios">Ofícios</button><button class="tab" data-target="fOitiva">Oitiva em Penitenciária</button><div class="hint">Modelos e funções preservados · dados mantidos localmente no navegador</div></div><iframe id="fOficios" class="frame active" src="oficios-core.html" title="Ofícios"></iframe><iframe id="fOitiva" class="frame" src="oitiva-penitenciaria.html" title="Oitiva em Penitenciária"></iframe><script>
const tabs=[...document.querySelectorAll('.tab')],frames=[...document.querySelectorAll('.frame')];
function fit(f){try{const d=f.contentDocument;const h=Math.max(d?.documentElement?.scrollHeight||0,d?.body?.scrollHeight||0,900);f.style.height=(h+20)+'px'}catch(e){f.style.height='calc(100vh - 55px)'}}
tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.toggle('active',x===b));frames.forEach(f=>f.classList.toggle('active',f.id===b.dataset.target));const f=document.getElementById(b.dataset.target);setTimeout(()=>fit(f),80);window.scrollTo({top:0,behavior:'instant'})});
frames.forEach(f=>f.addEventListener('load',()=>{fit(f);try{new ResizeObserver(()=>fit(f)).observe(f.contentDocument.documentElement)}catch(e){}}));
</script></body></html>
