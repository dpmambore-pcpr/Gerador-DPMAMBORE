<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central de Ofícios — PCPR</title>
<style>
:root{
  --ink:#111820;
  --accent:#285748;
  --accent-dark:#183a31;
  --gold:#c5a253;
  --bg:#f4f2ec;
  --line:#d8d3c8;
  --text:#17202a;
  --muted:#626b70;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif
}
.wrap{padding:10px}
.tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  padding:8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:linear-gradient(115deg,var(--ink) 0%,var(--accent-dark) 72%,#20473c 100%);
  border-bottom:4px solid var(--gold);
  margin-bottom:8px
}
.tab{
  border:1px solid rgba(255,255,255,.24);
  background:rgba(255,255,255,.07);
  color:#f4f2ec;
  border-radius:8px;
  padding:9px 12px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  transition:.15s
}
.tab:hover{
  background:#285748;
  border-color:#6f9486
}
.tab.active{
  background:var(--gold);
  border-color:#e2cf9d;
  color:var(--ink)
}
.frame{
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
  background:#fff
}
iframe{
  display:block;
  width:100%;
  height:calc(100vh - 82px);
  min-height:720px;
  border:0;
  background:#fff
}
@media(max-width:650px){
  .tab{flex:1 1 45%;padding:9px 6px;font-size:10px}
  iframe{height:calc(100vh - 130px)}
}
</style>
</head>
<body>
<div class="wrap">
<nav class="tabs">
<button class="tab" data-src="oficio-coffee-break.html?v=2.4.1">Coffee Break</button>
<button class="tab" data-src="diario-bordo.html?v=2.4.1">Diário de Bordo</button>
<button class="tab" data-src="oficio-diaria.html?v=2.4.1">Diárias</button>
<button class="tab active" data-src="oficios-core.html?v=2.4.1">Ofícios</button>
<button class="tab" data-src="oitiva-penitenciaria.html?v=2.4.1">Oitiva em Penitenciária</button>
<button class="tab" data-src="pericia.html?v=2.4.1">Perícia</button>
<button class="tab" data-src="relatorio-viagem.html?v=2.4.1">Relatório de Viagem</button>
</nav>
<div class="frame"><iframe id="f" src="oficios-core.html?v=2.4.1" title="Central de Ofícios"></iframe></div>
</div>
<script>
const f=document.getElementById('f');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 b.classList.add('active'); f.src=b.dataset.src;
});
</script>
</body></html>
