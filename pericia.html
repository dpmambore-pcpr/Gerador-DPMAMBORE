<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ofício à Perícia — PCPR</title>
<style>
:root{--azul:#0b2a4a;--azul2:#123f6d;--ouro:#cba64b;--b:#ccd6e2;--bg:#f4f7fa;--txt:#17202a;--mut:#607080;--ok:#137a4c}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:linear-gradient(110deg,#0d2027,#113f36);color:#fff;padding:13px 20px;border-bottom:4px solid var(--ouro)}
header h1{font-size:18px;margin:0}header p{font-size:12px;margin:4px 0 0;opacity:.85}
main{max-width:1480px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:minmax(410px,520px) minmax(620px,1fr);gap:16px;align-items:start}
.panel{background:#fff;border:1px solid var(--b);border-radius:9px;padding:15px;box-shadow:0 2px 8px #0000000a}.panel h2{font-size:14px;color:var(--azul);margin:0 0 12px;text-transform:uppercase;letter-spacing:.4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:#45576a}
input,textarea,select{width:100%;border:1px solid #bac8d7;border-radius:6px;padding:9px 10px;font:inherit;font-size:13px;background:#fff}textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:6px;padding:9px 13px;background:var(--azul2);color:#fff;font-weight:700;cursor:pointer}.btn.sec{background:#fff;color:var(--azul2);border:1px solid #b7c7d8}.btn.danger{background:#8d2b2b}.btn.gold{background:#cba64b;color:#111}.small{font-size:11px;color:var(--mut);line-height:1.35}.status{font-size:12px;color:var(--ok);font-weight:700;min-height:18px}
.desc-item{display:grid;grid-template-columns:1fr auto;gap:7px;margin:7px 0}.desc-item textarea{min-height:62px}
details{border:1px solid #d7e0ea;border-radius:7px;padding:10px;margin-top:12px}summary{font-weight:800;color:var(--azul);cursor:pointer}
.doc-wrap{background:#d7dbe0;padding:18px;border-radius:8px;overflow:auto}
.doc{width:210mm;min-height:297mm;margin:auto;background:#fff;padding:50mm 20mm 18mm;box-shadow:0 1px 8px #0003;position:relative;font-family:"Times New Roman",serif;font-size:12pt;line-height:1.5;color:#111;overflow:visible}
.doc:before{content:"";position:absolute;inset:0;background:url("papel-pericia.png") top center/210mm 297mm repeat-y;opacity:1;pointer-events:none;z-index:0}
.doc>*{position:relative;z-index:1}.letterhead{display:none}
.ofn{font-weight:bold;margin:0;line-height:1.5}
.date{text-align:right;margin:4mm 0 0;line-height:1.5}
.salute{font-weight:bold;margin:3.5mm 0 14mm 20mm;line-height:1.5}
.bodyp{text-align:justify;text-indent:20mm;margin:0 0 6mm;line-height:1.5}
.lead{margin:10mm 0 4mm 20mm;line-height:1.5}
.bullet{margin:0 0 5mm 32mm;text-align:justify;line-height:1.5}
.bullet:before{content:"• ";margin-left:-6mm}
.section-title{font-weight:bold;margin:10mm 0 4mm 20mm;line-height:1.5}
.sign{margin:12mm 0 0 50mm;text-align:center;width:90mm;line-height:1.5}
.dest{margin-top:30mm;font-weight:bold;line-height:1.5}.dest div{margin:1mm 0}.mono{font-family:Consolas,monospace}.preview-empty{color:#777}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.doc-wrap{max-height:none}.doc{transform-origin:top left}}
@media print{
@page{size:A4 portrait;margin:50mm 20mm 18mm}
html,body{background:#fff;margin:0;padding:0}
header,.left,.print-hide{display:none!important}main{padding:0;max-width:none}.grid{display:block}.panel.preview{border:0;padding:0;box-shadow:none}.doc-wrap{padding:0;background:#fff;overflow:visible}
.doc{width:auto;min-height:0;box-shadow:none;margin:0;padding:0;background:transparent;position:static;font-size:12pt;line-height:1.5}
.doc:before{content:"";position:fixed;left:-20mm;top:-50mm;width:210mm;height:297mm;background:url("papel-pericia.png") top left/210mm 297mm no-repeat;z-index:-1}
.ofn{margin:0}.date{margin-top:4mm}.salute{margin:3.5mm 0 14mm 20mm}.bodyp{margin-bottom:6mm}.lead{margin-top:10mm}.section-title{margin-top:10mm}.sign{margin-top:12mm}.dest{margin-top:30mm}
}
</style></head><body>
<header><h1>OFÍCIO À PERÍCIA</h1><p>Gerador integrado à Central de Ofícios · os dados permanecem neste navegador</p></header>
<main><div class="grid">
<section class="panel left"><h2>Dados do Ofício</h2>
<div class="form">
<label>Inquérito Policial<input id="ip" placeholder="Ex.: 231083/2026 ou 231083.2026" inputmode="numeric"><span class="small">No cabeçalho: <b id="ipTopPrev">—</b> · no corpo: <b id="ipBodyPrev">—</b></span></label>
<label>Sequência / identificador<input id="seq" placeholder="Ex.: 02/2026 - AGM"></label>
<label>Data<input id="data" type="date"></label>
<label>Nº dos autos (PROJUDI)<input id="autos" class="mono" placeholder="0001261-40.2026.8.16.0172" inputmode="numeric"></label>
<label>Boletim de Ocorrência <span class="small">(opcional)</span><input id="bo" placeholder="Ex.: 651846/2026"></label>
<label>Delito<input id="delito" placeholder="Ex.: ART. 157, C/C ART. 14, II, CP"></label>
<label class="full">Vítima(s)<textarea id="vitimas" placeholder="Informe uma ou mais vítimas"></textarea></label>
<label class="full">Investigado(s)<textarea id="investigados" placeholder="Informe um ou mais investigados"></textarea></label>
<label class="full">Destino<select id="destino"><option>Curitiba</option><option>Cascavel</option><option>Campo Mourão</option></select></label>
</div>
<h2 style="margin-top:18px">Descrição dos vestígios</h2><div id="descs"></div><div class="row"><button class="btn sec" id="addDesc" type="button">+ Adicionar descrição</button></div>
<details><summary>⚙ Configuração — cabeçalho, rodapé e delegado</summary><div class="form" style="margin-top:12px">
<label class="full">Cabeçalho<textarea id="cfgHeader" rows="5"></textarea></label>
<label>Cidade<input id="cfgCidade"></label><label>UF<input id="cfgUf" maxlength="2"></label>
<label class="full">Rodapé<textarea id="cfgFooter" rows="3"></textarea></label>
<label class="full">Delegado<select id="cfgDelegado"></select></label>
</div><div class="row" style="margin-top:9px"><button id="saveCfg" class="btn sec" type="button">Salvar configuração</button><button id="reloadCfg" class="btn sec" type="button">Recarregar configuração geral</button></div></details>
<div class="row" style="margin-top:15px"><button id="printBtn" class="btn gold" type="button">Imprimir / Salvar PDF</button><button id="odtBtn" class="btn" type="button">Baixar ODT</button><button id="clearBtn" class="btn sec" type="button">Limpar campos</button></div><div id="status" class="status"></div>
</section>
<section class="panel preview"><h2 class="print-hide">Pré-visualização</h2><div class="doc-wrap"><article id="doc" class="doc"></article></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id); const CFG_KEY='pcpr.pericia.config.v1', GENERAL_KEY='pcpr.configGeralUnidade.v1', DELEGADOS_KEY='pcpr.oitivaPenal.delegados.v1';
const DEF={header:['ESTADO DO PARANÁ','SECRETARIA DE ESTADO DA SEGURANÇA PÚBLICA','DEPARTAMENTO DE POLÍCIA CIVIL','16ª SUBDIVISÃO POLICIAL DE CAMPO MOURÃO','DELEGACIA DE POLÍCIA DE MAMBORÊ'],footer:['Av. Augusto Mendes dos Santos, 997, Mamborê - PR, 87340-000','Email: dpmambore@pc.pr.gov.br – Fone/Fax: (44) 3865-1341 – www.policiacivil.pr.gov.br'],cidade:'Mamborê',uf:'PR',delegados:['Anderson Sérgio Romão'],delegado:'Anderson Sérgio Romão'};
function jget(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function xml(s){return esc(s)}
function deriveCfg(){const g=jget(GENERAL_KEY)||{}, ds=jget(DELEGADOS_KEY); const h=[g.estadoHeader,g.secretaria,g.departamento,g.subdivisao,g.unidade].filter(Boolean); const f1=[g.endereco,[g.cidade,g.uf].filter(Boolean).join(' - '),g.cep].filter(Boolean).join(', '); const f2=[g.email?'Email: '+g.email:'',g.fone?'Fone/Fax: '+g.fone:'',g.site||''].filter(Boolean).join(' – '); return {...DEF,header:h.length?h:DEF.header,footer:(f1||f2)?[f1,f2].filter(Boolean):DEF.footer,cidade:g.cidade||DEF.cidade,uf:g.uf||DEF.uf,delegados:Array.isArray(ds)&&ds.length?ds:(Array.isArray(g.delegados)&&g.delegados.length?g.delegados:DEF.delegados)} }
let cfg={...deriveCfg(),...(jget(CFG_KEY)||{})}; if(!cfg.delegados?.length)cfg.delegados=DEF.delegados; if(!cfg.delegado)cfg.delegado=cfg.delegados[0];
function cfgToUi(){ $('cfgHeader').value=(cfg.header||[]).join('\n'); $('cfgFooter').value=(cfg.footer||[]).join('\n'); $('cfgCidade').value=cfg.cidade||''; $('cfgUf').value=cfg.uf||'PR'; $('cfgDelegado').innerHTML=(cfg.delegados||[]).map(x=>`<option ${x===cfg.delegado?'selected':''}>${esc(x)}</option>`).join(''); }
function uiToCfg(){ cfg.header=$('cfgHeader').value.split(/\n+/).map(x=>x.trim()).filter(Boolean); cfg.footer=$('cfgFooter').value.split(/\n+/).map(x=>x.trim()).filter(Boolean); cfg.cidade=$('cfgCidade').value.trim()||'Mamborê'; cfg.uf=$('cfgUf').value.trim().toUpperCase()||'PR'; cfg.delegado=$('cfgDelegado').value||cfg.delegados[0]||''; }
function parseIP(v){v=String(v||'').trim(); const m=v.match(/(\d{1,9})\D*(\d{4})/); if(!m)return {n:'',ano:'',top:'',body:''}; return {n:m[1],ano:m[2],top:m[1]+'.'+m[2],body:m[1]+'/'+m[2]}}
function maskAutos(v){let d=String(v||'').replace(/\D/g,'').slice(0,20); if(d.length<20)return d; return d.slice(0,7)+'-'+d.slice(7,9)+'.'+d.slice(9,13)+'.'+d.slice(13,14)+'.'+d.slice(14,16)+'.'+d.slice(16,20)}
function dateLong(v){if(!v)return ''; const [y,m,d]=v.split('-').map(Number); const dt=new Date(y,m-1,d); return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'long',year:'numeric'}).format(dt).replace(/^0/,'')}
function val(id){return $(id).value.trim()} function descValues(){return [...document.querySelectorAll('.desc-text')].map(x=>x.value.trim()).filter(Boolean)}
function addDesc(text=''){const row=document.createElement('div');row.className='desc-item';row.innerHTML=`<textarea class="desc-text" placeholder="Digite livremente a descrição do vestígio/objeto">${esc(text)}</textarea><button type="button" class="btn danger remove">×</button>`;row.querySelector('.remove').onclick=()=>{if(document.querySelectorAll('.desc-item').length>1)row.remove();else row.querySelector('textarea').value='';render()};row.querySelector('textarea').addEventListener('input',render);$('descs').appendChild(row)}
function render(){uiToCfg();const ip=parseIP(val('ip'));$('ipTopPrev').textContent=ip.top||'—';$('ipBodyPrev').textContent=ip.body||'—'; let autos=maskAutos(val('autos')); if(val('autos')!==autos&&autos.length===20+4)$('autos').value=autos; const seq=val('seq'); const ofno=[ip.top,seq].filter(Boolean).join('.'); const bo=val('bo'), delito=val('delito'), vit=val('vitimas'), inv=val('investigados'); const ds=descValues(); const cidade=cfg.cidade||'Mamborê',uf=cfg.uf||'PR';
let out=`<p class="ofn">Ofício nº ${esc(ofno||'—')}</p><p class="date">${esc(cidade)}/${esc(uf)}, ${esc(dateLong(val('data'))||'—')}.</p><p class="salute">Ilustríssimo Perito Criminal,</p><p class="bodyp">Nos termos da Lei Federal nº 12.830/2013, que estabelece as prerrogativas do Delegado de Polícia na condução da investigação criminal, e em observância à Lei Complementar nº 259, de 21 de julho de 2023, que instituiu o novo Estatuto da Polícia Civil do Estado do Paraná, considerando a imprescindibilidade de prova técnica especializada, <b>REQUEIRO</b> a realização de Perícia Técnica nos vestígios apreendidos e abaixo pormenorizadamente descritos, visando à coleta, análise e preservação dos dados e demais elementos de prova, nos rigorosos parâmetros legais e técnicos previstos.</p><p class="lead">Assim, atinente aos seguintes autos:</p>`;
let ref=`<b>Inquérito Policial nº ${esc(ip.body||'—')}</b>`+(autos?` (<b>PROJUDI nº ${esc(autos)}</b>)`:'')+(bo?`, referente ao Boletim de Ocorrência nº <b>${esc(bo)}</b>`:'')+`, pelo qual apura-se o delito descrito no <b>${esc(delito||'—')}</b>, tendo como vítima(s) <b>${esc(vit||'—')}</b> e investigado(s) <b>${esc(inv||'—')}</b>.`;
out+=`<p class="bullet">${ref}</p><p class="section-title">Descrição dos vestígios que acompanham este expediente:</p>`; out+=(ds.length?ds:['—']).map(x=>`<p class="bullet"><b>${esc(x)}</b></p>`).join('');
out+=`<p class="bodyp">Por fim, requisito que seja cumprido integralmente o que foi determinado pela Autoridade Judicial na decisão proferida nos autos nº <b>${esc(autos||'—')}</b>, procedendo-se à perícia técnica nos aparelhos encaminhados, com a extração, preservação e análise dos dados nos limites da autorização judicial, devendo o Laudo Pericial, relatórios de extração e eventuais arquivos complementares serem encaminhados para o e-mail desta Unidade Policial: <u>${esc((jget(GENERAL_KEY)||{}).email||'dpmambore@pc.pr.gov.br')}</u>.</p><p class="bodyp">Sem mais para o momento, renovo votos de elevada consideração e aguardo o atendimento da presente requisição no prazo indicado.</p><p style="margin:32px 0 0 55px">Atenciosamente,</p><div class="sign"><b>${esc((cfg.delegado||'').toUpperCase())}</b><br><b>Delegado de Polícia</b></div><div class="dest"><div>AO(À) ILUSTRÍSSIMO(A) SENHOR(A) DIRETOR(A)</div><div>POLÍCIA CIENTÍFICA DO PARANÁ – ${esc(val('destino').toUpperCase())}/PR</div></div>`;
$('doc').innerHTML=out; }
['ip','seq','data','autos','bo','delito','vitimas','investigados','destino','cfgHeader','cfgFooter','cfgCidade','cfgUf','cfgDelegado'].forEach(id=>$(id).addEventListener('input',render));
$('autos').addEventListener('blur',()=>{$('autos').value=maskAutos(val('autos'));render()}); $('addDesc').onclick=()=>{addDesc();render()};
$('saveCfg').onclick=()=>{uiToCfg(); localStorage.setItem(CFG_KEY,JSON.stringify(cfg));$('status').textContent='Configuração da Perícia salva neste navegador.';render()}; $('reloadCfg').onclick=()=>{const d=deriveCfg();cfg={...d,delegado:d.delegados[0]||''};cfgToUi();render();$('status').textContent='Configuração geral recarregada.'};
$('printBtn').onclick=()=>window.print(); $('clearBtn').onclick=()=>{if(!confirm('Limpar os campos deste ofício?'))return;['ip','seq','autos','bo','delito','vitimas','investigados'].forEach(id=>$(id).value='');$('descs').innerHTML='';addDesc();setToday();render()};
function setToday(){const n=new Date();const y=n.getFullYear(),m=String(n.getMonth()+1).padStart(2,'0'),d=String(n.getDate()).padStart(2,'0');$('data').value=`${y}-${m}-${d}`}
// ZIP writer sem compressão para gerar ODT localmente
const te=new TextEncoder(); function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (c^0xffffffff)>>>0} function u16(n){return [n&255,(n>>>8)&255]} function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function makeZip(files){let parts=[],central=[],off=0;for(const f of files){const name=te.encode(f.name),data=f.data instanceof Uint8Array?f.data:te.encode(f.data),crc=crc32(data),lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...name]);parts.push(lh,data);const ch=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...name]);central.push(ch);off+=lh.length+data.length}const csize=central.reduce((a,x)=>a+x.length,0),eocd=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);return new Blob([...parts,...central,eocd],{type:'application/vnd.oasis.opendocument.text'})}
function odtContent(){const ip=parseIP(val('ip')),autos=maskAutos(val('autos')),bo=val('bo'),del=val('delito'),vit=val('vitimas'),inv=val('investigados'),seq=val('seq'),ofno=[ip.top,seq].filter(Boolean).join('.'),ds=descValues(); const p=s=>`<text:p text:style-name="P">${xml(s)}</text:p>`, pb=s=>`<text:p text:style-name="P"><text:span text:style-name="B">${xml(s)}</text:span></text:p>`; let body='';
body+=`<text:p text:style-name="P"><text:span text:style-name="B">Ofício nº ${xml(ofno)}</text:span></text:p><text:p text:style-name="Right">${xml(cfg.cidade+'/'+cfg.uf+', '+dateLong(val('data'))+'.')}</text:p><text:p text:style-name="P"><text:span text:style-name="B">Ilustríssimo Perito Criminal,</text:span></text:p>`;
body+=p('Nos termos da Lei Federal nº 12.830/2013, que estabelece as prerrogativas do Delegado de Polícia na condução da investigação criminal, e em observância à Lei Complementar nº 259, de 21 de julho de 2023, que instituiu o novo Estatuto da Polícia Civil do Estado do Paraná, considerando a imprescindibilidade de prova técnica especializada, REQUEIRO a realização de Perícia Técnica nos vestígios apreendidos e abaixo pormenorizadamente descritos, visando à coleta, análise e preservação dos dados e demais elementos de prova, nos rigorosos parâmetros legais e técnicos previstos.'); body+=p('Assim, atinente aos seguintes autos:'); let r=`Inquérito Policial nº ${ip.body}`+(autos?` (PROJUDI nº ${autos})`:'')+(bo?`, referente ao Boletim de Ocorrência nº ${bo}`:'')+`, pelo qual apura-se o delito descrito no ${del}, tendo como vítima(s) ${vit} e investigado(s) ${inv}.`;body+=pb('• '+r);body+=pb('Descrição dos vestígios que acompanham este expediente:');(ds.length?ds:['']).forEach(x=>body+=p('• '+x)); body+=p(`Por fim, requisito que seja cumprido integralmente o que foi determinado pela Autoridade Judicial na decisão proferida nos autos nº ${autos}, procedendo-se à perícia técnica nos aparelhos encaminhados, com a extração, preservação e análise dos dados nos limites da autorização judicial, devendo o Laudo Pericial, relatórios de extração e eventuais arquivos complementares serem encaminhados para o e-mail desta Unidade Policial: ${(jget(GENERAL_KEY)||{}).email||'dpmambore@pc.pr.gov.br'}.`);body+=p('Sem mais para o momento, renovo votos de elevada consideração e aguardo o atendimento da presente requisição no prazo indicado.');body+=p('Atenciosamente,');body+=`<text:p text:style-name="Center"><text:span text:style-name="B">${xml((cfg.delegado||'').toUpperCase())}</text:span><text:line-break/><text:span text:style-name="B">Delegado de Polícia</text:span></text:p>`;body+=`<text:p text:style-name="P"><text:span text:style-name="B">AO(À) ILUSTRÍSSIMO(A) SENHOR(A) DIRETOR(A)</
